name: Build and Deploy Pipeline

on:
  workflow_dispatch:   # manual trigger only

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t amruthaachar08/myapp:latest .
          docker push amruthaachar08/myapp:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.35.1

      - name: Configure Kubeconfig
        run: |
          # For Minikube, you’ll need to export kubeconfig manually
          # For cloud clusters (EKS/GKE/AKS), store kubeconfig in GitHub Secrets
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl rollout restart deployment myapp-deployment
          kubectl apply -f k8s/service.yaml
